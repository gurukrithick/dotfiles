# Colors
root_color=0x222222ff
border_color=0x222222ff
focus_color=0x393939ff
urgent_color=0xa08080ff
scratchpad_color=0x4a4a4aff

# Borders & Gaps
border_px=2
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
no_border_when_single=1

# Visuals
border_radius=12
blur=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=8
blur_params_noise=0.08
blur_params_brightness=1.1
blur_params_saturation=1.1
shadows=0

# Opacity
focused_opacity=0.97
unfocused_opacity=0.92

# Animations
animations=1
layer_animations=0
blur_layer=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.6
fade_out_begin_opacity=0.9
zoom_initial_ratio=0.85
zoom_end_ratio=1.0
tag_animation_direction=1
animation_duration_open=170
animation_duration_close=130
animation_duration_move=170
animation_duration_tag=170
animation_curve_open=0.16,1,0.3,1
animation_curve_close=0.4,0,1,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.22,1,0.36,1

# Overview
enable_hotarea=0
overview_gap_inner=6
overview_gap_outer=24
jump_label_decorate_fg_color=0xe8e8e8ff
jump_label_decorate_bg_color=0x222222ff
jump_label_decorate_focus_fg_color=0x222222ff
jump_label_decorate_focus_bg_color=0xe8e8e8ff
jump_label_decorate_border_color=0x393939ff
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=8
jump_label_decorate_padding_x=16
jump_label_decorate_padding_y=16
jump_label_decorate_font_desc=Maple Mono NF Bold 30

# Group Bar
group_bar_height=30
group_bar_decorate_fg_color=0x9a9a9aff
group_bar_decorate_bg_color=0x222222ff
group_bar_decorate_focus_fg_color=0x222222ff
group_bar_decorate_focus_bg_color=0xe8e8e8ff
group_bar_decorate_border_color=0x393939ff
group_bar_decorate_border_width=1
group_bar_decorate_corner_radius=6
group_bar_decorate_padding_x=10
group_bar_decorate_padding_y=0
group_bar_decorate_font_desc=Maple Mono NF 13

# Behavior
auto_reload_config=1
float_full_to_top=1
tag_gather=0
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000030
focus_on_activate=1
sloppy_focus=0
warp_cursor=1
single_scratchpad=1
focus_cross_monitor=0
exchange_cross_monitor=0
focus_cross_tag=0
view_current_to_back=0
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1
cursor_hide_on_keypress=1
cursor_hide_timeout=0
cursor_size=24
cursor_theme=Adwaita
sync_obj_enable=1
xwayland_persistence=1
idle_inhibit_ignore_visible=0

# Env vars
env=XDG_CURRENT_DESKTOP,wlroots
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Start ups
exec_once=sh -c 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user restart xdg-desktop-portal-wlr xdg-desktop-portal'
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Noctalia
exec_once=noctalia
# hidden kitty so terminals open fast
exec_once=kitty --single-instance --start-as=hidden
exec_once=swayidle -w timeout 300 'swaylock -f -C ~/.config/swaylock/config' timeout 330 'wlopm --off "*"' resume 'wlopm --on "*"' before-sleep 'swaylock -f -C ~/.config/swaylock/config' lock 'swaylock -f -C ~/.config/swaylock/config'
# laptop on 6, main on 1
exec_once=sh -c '~/.config/mango/scripts/workspace.sh view 6 && ~/.config/mango/scripts/workspace.sh view 1'

# Keyboard
repeat_delay=300
repeat_rate=30
numlock_on=0
xkb_rules_layout=us
xkb_rules_options=caps:escape

# Mouse
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0
axis_scroll_factor=1.0

# Trackpad
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_accel_profile=2
trackpad_accel_speed=0.3
trackpad_scroll_factor=1.0
trackpad_scroll_method=1
trackpad_click_method=2
send_events_mode=2
swipe_min_threshold=20
button_map=0

# Tags
tag_num=9
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:monocle,no_render_border:1
tag_rule=id:4,layout_name:tile,master_count:1,master_factor:0.55
tag_rule=id:5,layout_name:fair
tag_rule=id:6,layout_name:monocle,no_render_border:1
tag_rule=id:7,layout_name:monocle,no_render_border:1
tag_rule=id:8,layout_name:fair
tag_rule=id:9,layout_name:fair

# Monocle/deck
monocle_tab_mode=0
deck_tab_mode=0

# Scroller
scroller_structs=0
scroller_default_proportion=1.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.67,1.0
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1

# Outputs
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:120,x:0,y:0,scale:1
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1

# Rules
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=no_animation:1,no_blur:1,layer_name:^noctalia
# blur only visible panels, toasts, OSDs
layer_rule=no_animation:1,no_blur:0,layer_name:^noctalia-(panel|attached-panel|notification|osd)$
layer_rule=animation_type_open:slide,animation_type_close:fade,layer_name:notifications
layer_rule=shield_when_capture:1,layer_name:notifications
layer_rule=shield_when_capture:1,layer_name:noctalia-notification

window_rule=shield_when_capture:1,app_id:.*[Bb]itwarden.*
window_rule=shield_when_capture:1,app_id:gcr-prompter
window_rule=shield_when_capture:1,app_id:polkit-gnome-authentication-agent-1

window_rule=is_floating:1,title:^Authentication Required$
window_rule=is_floating:1,app_id:gcr-prompter
window_rule=is_floating:1,app_id:polkit-gnome-authentication-agent-1
window_rule=is_floating:1,app_id:pavucontrol,width:800,height:600
window_rule=is_floating:1,app_id:blueman-manager,width:700,height:500
window_rule=is_floating:1,app_id:.blueman-manager-wrapped,width:700,height:500
window_rule=is_floating:1,app_id:nm-connection-editor,width:800,height:600
window_rule=is_floating:1,app_id:imv,width:1280,height:800

window_rule=is_floating:1,app_id:thunar,title:File Operation Progress
window_rule=is_floating:1,app_id:thunar,title:Confirm to replace files
window_rule=is_floating:1,app_id:thunar,title:^Rename.*

window_rule=is_floating:1,app_id:zen.*,title:^Library$
window_rule=is_floating:1,app_id:zen.*,title:.*Sharing Indicator.*
window_rule=is_floating:1,app_id:chromium,title:^Save File$
window_rule=is_floating:1,app_id:chromium,title:^Open File$

window_rule=is_floating:1,is_global:1,app_id:mpv,idle_inhibit_when_focus:1
window_rule=is_floating:1,is_global:1,no_border:1,width:640,height:360,offset_x:-30,offset_y:-30,title:Picture-in-Picture

window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:kitty
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:zen.*
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:chromium
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:org.pwmt.zathura
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:imv
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:mpv

# Bindings
circle_layout=scroller,fair,monocle,tile

key_mode=common
bind=SUPER+CTRL,r,reload_config
bind=SUPER+CTRL,b,spawn,sh -c 'pkill -x noctalia; for i in $(seq 50); do pgrep -x noctalia >/dev/null || break; sleep 0.1; done; exec noctalia'
bind=SUPER,Escape,setkeymode,default
key_mode=default

bind=SUPER,Return,spawn,kitty --single-instance --session ~/.config/kitty/greet.session
bind=SUPER,t,spawn,kitty --single-instance --session ~/.config/kitty/greet.session
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER+SHIFT,b,spawn,zen-browser
bind=SUPER+SHIFT,c,spawn,chromium
bind=SUPER+SHIFT,e,spawn,thunar
bind=SUPER+CTRL,q,spawn,noctalia msg panel-toggle session
bind=SUPER,c,spawn,noctalia msg panel-toggle control-center
bind=SUPER+SHIFT,t,spawn,noctalia msg plugin guru/themes:switcher all toggle

bind=SUPER+SHIFT,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+CTRL,Delete,spawn,sh -c 'noctalia msg clipboard-clear && notify-send "Clipboard cleared"'

bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER,x,togglemaximizescreen
bind=SUPER,z,zoom
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,minus,toggle_scratchpad
bind=SUPER+SHIFT,minus,minimized

# Focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

bind=ALT,Tab,focuslast
bind=SUPER,Tab,focusstack,1
bind=SUPER+SHIFT,Tab,focusstack,-1

bind=SUPER,slash,togglejump
bind=SUPER,grave,overcircle,next
bind=SUPER+SHIFT,grave,overcircle,prev
bind=SUPER+CTRL,grave,toggleoverview
bind=SUPER+CTRL,0,view,0

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# Main + companion
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT+SHIFT,Left,tagmon,left
bind=SUPER+ALT+SHIFT,Right,spawn,~/.config/mango/scripts/workspace.sh tag 6

bind=SUPER,s,setlayout,scroller
bind=SUPER,m,setlayout,monocle
bind=SUPER,g,setlayout,fair
bind=SUPER,v,setlayout,vertical_tile
bind=SUPER,w,setlayout,deck
bind=SUPER,space,switch_layout

bind=SUPER+CTRL,Left,setmfact,-0.05
bind=SUPER+CTRL,Right,setmfact,+0.05
bind=SUPER,i,incnmaster,+1
bind=SUPER,p,incnmaster,-1

bind=SUPER+CTRL,p,switch_proportion_preset
bind=SUPER+CTRL,m,set_proportion,1.0
bind=SUPER+CTRL,bracketright,scroller_stack,right
bind=SUPER+CTRL,bracketleft,scroller_stack,left

bind=SUPER+SHIFT,g,groupjoin,right
bind=SUPER+SHIFT,u,groupleave
bind=SUPER,bracketleft,groupfocus,prev
bind=SUPER,bracketright,groupfocus,next

bind=SUPER,1,spawn,~/.config/mango/scripts/workspace.sh view 1
bind=SUPER,2,spawn,~/.config/mango/scripts/workspace.sh view 2
bind=SUPER,3,spawn,~/.config/mango/scripts/workspace.sh view 3
bind=SUPER,4,spawn,~/.config/mango/scripts/workspace.sh view 4
bind=SUPER,5,spawn,~/.config/mango/scripts/workspace.sh view 5
bind=SUPER,6,spawn,~/.config/mango/scripts/workspace.sh view 6
bind=SUPER,7,spawn,~/.config/mango/scripts/workspace.sh view 7
bind=SUPER,8,spawn,~/.config/mango/scripts/workspace.sh view 8
bind=SUPER,9,spawn,~/.config/mango/scripts/workspace.sh view 9

bind=SUPER+SHIFT,1,spawn,~/.config/mango/scripts/workspace.sh tag 1
bind=SUPER+SHIFT,2,spawn,~/.config/mango/scripts/workspace.sh tag 2
bind=SUPER+SHIFT,3,spawn,~/.config/mango/scripts/workspace.sh tag 3
bind=SUPER+SHIFT,4,spawn,~/.config/mango/scripts/workspace.sh tag 4
bind=SUPER+SHIFT,5,spawn,~/.config/mango/scripts/workspace.sh tag 5
bind=SUPER+SHIFT,6,spawn,~/.config/mango/scripts/workspace.sh tag 6
bind=SUPER+SHIFT,7,spawn,~/.config/mango/scripts/workspace.sh tag 7
bind=SUPER+SHIFT,8,spawn,~/.config/mango/scripts/workspace.sh tag 8
bind=SUPER+SHIFT,9,spawn,~/.config/mango/scripts/workspace.sh tag 9

bind=SUPER,n,viewtoright_have_client
bind=SUPER,b,viewtoleft_have_client

bind=SUPER,r,setkeymode,resize

key_mode=resize
bind=NONE,h,resizewin,-30,0
bind=NONE,j,resizewin,0,+30
bind=NONE,k,resizewin,0,-30
bind=NONE,l,resizewin,+30,0
bind=NONE,Left,resizewin,-30,0
bind=NONE,Down,resizewin,0,+30
bind=NONE,Up,resizewin,0,-30
bind=NONE,Right,resizewin,+30,0
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
key_mode=default

# theme carousel (Super+Shift+T): the plugin overlay only gets keys in text
# fields, so forward them. "c" binds skip compositor repeat.
key_mode=themes
bindpc=NONE,Left,spawn,noctalia msg plugin guru/themes:carousel all press left
bindrpc=NONE,Left,spawn,noctalia msg plugin guru/themes:carousel all release left
bindpc=NONE,Right,spawn,noctalia msg plugin guru/themes:carousel all press right
bindrpc=NONE,Right,spawn,noctalia msg plugin guru/themes:carousel all release right
bindp=NONE,Up,spawn,noctalia msg plugin guru/themes:carousel all press up
bindp=NONE,Down,spawn,noctalia msg plugin guru/themes:carousel all press down
bind=NONE,Tab,spawn,noctalia msg plugin guru/themes:carousel all press tab
bind=SHIFT,ISO_Left_Tab,spawn,noctalia msg plugin guru/themes:carousel all press backtab
bind=NONE,Return,spawn,noctalia msg plugin guru/themes:carousel all press return
bind=NONE,KP_Enter,spawn,noctalia msg plugin guru/themes:carousel all press return
bind=NONE,Escape,spawn_shell,mmsg dispatch setkeymode,default; noctalia msg plugin guru/themes:carousel all close
bind=SUPER+SHIFT,t,spawn,noctalia msg plugin guru/themes:switcher all toggle
key_mode=default

bind=SUPER+CTRL,l,spawn,sh -c 'swaylock -f -C ~/.config/swaylock/config'
bind=SUPER+CTRL,s,spawn,sh -c 'swaylock -f -C ~/.config/swaylock/config && systemctl suspend'
bind=SUPER+CTRL+SHIFT,r,spawn,systemctl reboot
bind=SUPER+CTRL+SHIFT,p,spawn,systemctl poweroff
bind=SUPER,F10,toggle_trackpad_enable
bind=SUPER+SHIFT,f,spawn,~/.local/bin/powerboost toggle
bind=SUPER+CTRL,t,spawn,~/.local/bin/theme next

# via noctalia so the OSD shows
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=SUPER+SHIFT,a,spawn,~/.local/bin/audio-switch
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up eDP-1 2
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down eDP-1 2
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

bind=SUPER,Print,spawn,~/.config/mango/scripts/screenshot-region-file.sh
bind=SUPER+SHIFT,Print,spawn,~/.config/mango/scripts/screenshot-full-file.sh
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/screenshot-clip.sh
bind=SUPER+SHIFT,r,spawn,~/.config/mango/scripts/record.sh

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,killclient,0

gesturebind=NONE,left,3,focusdir,right
gesturebind=NONE,right,3,focusdir,left
gesturebind=NONE,up,3,focusdir,up
gesturebind=NONE,down,3,focusdir,down
gesturebind=NONE,left,4,viewtoright_have_client
gesturebind=NONE,right,4,viewtoleft_have_client
gesturebind=NONE,up,4,togglejump
gesturebind=NONE,down,4,toggleoverview

# written by noctalia, last so it overrides the colours above
source_optional=~/.config/mango/noctalia.conf
