# Tokyo Night, a dock-like pill at the bottom

[bar]
order = ["default"]

[bar.default]
position = "bottom"
thickness = 40
margin_edge = 8
margin_ends = "21%" # ~1110 px at 1920
padding = 16
widget_spacing = 16
background_opacity = 1.0
border = "outline_variant"
border_width = 1.0
radius = 20
concave_edge_corners = false
shadow = false
scale = 1.35
font_scale = 0.85
font_weight = 500
capsule = false

start = ["workspaces", "pomodoro"]
center = ["media"]
end = ["privacy", "group:status", "group:tools", "tray", "notifications", "clock"]

# status and tools
[[bar.default.capsule_group]]
id = "status"
members = ["volume", "network", "battery"]
opacity = 0.0
border = ""
padding = 0.0
widget_spacing = 12

[[bar.default.capsule_group]]
id = "tools"
members = ["powerboost", "caffeine"]
opacity = 0.0
border = ""
padding = 0.0
widget_spacing = 12

# tags
[widget.workspaces]
style = "focus_hint"
show_icons = false
scale = 1.3
hide_when_empty = true
focused_color = "primary"
occupied_color = "on_surface_variant"
empty_color = "outline_variant"
urgent_color = "error"

[widget.pomodoro]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/pomodoro-widget quiet"
interval = 1
interval_units = "1"
json = true

[widget.pomodoro.actions]
left = "exec ~/.config/noctalia/scripts/pomodoro start"
right = "exec ~/.config/noctalia/scripts/pomodoro toggle"
middle = "exec ~/.config/noctalia/scripts/pomodoro reset"
scroll_up = "exec ~/.config/noctalia/scripts/pomodoro add"
scroll_down = "exec ~/.config/noctalia/scripts/pomodoro sub"

[widget.media]
hide_when_no_media = true
max_length = 240
art_size = 20
title_scroll = "on_hover"
color = "on_surface_variant"

[widget.privacy]
hide_inactive = true
active_color = "error"

[widget.volume]
show_label = false
peek = true
mute_color = "on_surface_variant"
color = "on_surface_variant"

[widget.network]
show_label = false
color = "on_surface_variant"

[widget.battery]
display_mode = "glyph"
show_label = true
color = "on_surface_variant"

[widget.notifications]
hide_when_no_unread = true
color = "on_surface_variant"

# clock: date on hover, dashboard on click, middle-click starts a focus session
[widget.clock]
format = "{:%H:%M}"
timezone = "Asia/Kolkata"
font_weight = 700
tooltip_format = "{:%A, %d %B %Y}"

[widget.clock.actions]
left = "panel-toggle control-center home"
middle = "exec ~/.config/noctalia/scripts/pomodoro start"

# follows power-profiles-daemon, profile changes go through the boost script
[widget.powerboost]
type = "power_profile"

[widget.powerboost.actions]
left = "exec ~/.local/bin/powerboost toggle"
right = "exec ~/.local/bin/powerboost toggle"
scroll_up = "none"
scroll_down = "none"

[widget.tray]
drawer = true

# bar is at the bottom, so keep toasts and OSD there too
[notification]
position = "bottom_right"

[osd]
position = "bottom_center"
offset_y = 56 # 8 px above the bar
